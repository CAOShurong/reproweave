<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">ReproWeave: turn a paper claim into a practical replication plan</title>
  <desc id="desc">A concrete three-step example shows a claim located in a paper, the resources checked against it, and a transparent decision about what to do next.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#617883"/>
    </marker>
  </defs>
  <rect width="1440" height="620" rx="10" fill="#F7F6F2"/>
  <rect x="1" y="1" width="1438" height="618" rx="9" fill="none" stroke="#D4D1C8" stroke-width="2"/>
  <rect width="1440" height="12" rx="10" fill="#17324D"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="720" y="54" fill="#8D4850" font-size="14" font-weight="700" letter-spacing="3">LOCAL-FIRST REPLICATION PLANNING</text>
    <text x="720" y="122" fill="#172635" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700">ReproWeave</text>
    <text x="720" y="161" fill="#59676F" font-size="20">Turn a paper claim into a transparent decision about what your lab should rebuild next.</text>
    <text x="720" y="194" fill="#7A7064" font-size="13">FICTIONAL EDGE-AI PAPER EXAMPLE</text>
  </g>

  <path d="M442 354H512M912 354H982" fill="none" stroke="#617883" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(60 225)">
      <rect width="382" height="268" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="382" height="52" rx="8" fill="#F1E9E9"/>
      <rect y="44" width="382" height="8" fill="#F1E9E9"/>
      <circle cx="191" cy="0" r="22" fill="#8D4850"/>
      <text x="191" y="6" fill="#FFFFFF" font-size="14" font-weight="800">1</text>
      <text x="191" y="33" fill="#17324D" font-size="14" font-weight="800" letter-spacing="1.4">LOCATE THE CLAIM</text>
      <text x="191" y="87" fill="#59676F" font-size="13">What exactly would you reproduce?</text>
      <text x="191" y="132" fill="#172635" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700">“92% accuracy”</text>
      <text x="191" y="163" fill="#59676F" font-size="14">Dataset Q · low-power device</text>
      <line x1="42" y1="191" x2="340" y2="191" stroke="#DDD9D0"/>
      <text x="191" y="220" fill="#354A55" font-size="13">Evidence locator</text>
      <text x="191" y="246" fill="#8D4850" font-size="13" font-weight="700">FIGURE 4 · PAGE 7</text>
    </g>

    <g transform="translate(529 225)">
      <rect width="382" height="268" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="382" height="52" rx="8" fill="#E9EEF0"/>
      <rect y="44" width="382" height="8" fill="#E9EEF0"/>
      <circle cx="191" cy="0" r="22" fill="#17324D"/>
      <text x="191" y="6" fill="#FFFFFF" font-size="14" font-weight="800">2</text>
      <text x="191" y="33" fill="#17324D" font-size="14" font-weight="800" letter-spacing="1.4">CHECK WHAT EXISTS</text>
      <text x="191" y="87" fill="#59676F" font-size="13">Record facts; leave unknowns unknown</text>
      <text x="104" y="128" fill="#354A55" font-size="14">Training code</text>
      <rect x="244" y="109" width="82" height="28" rx="14" fill="#E3EEE8"/>
      <text x="285" y="128" fill="#2F6B55" font-size="12" font-weight="800">FOUND</text>
      <text x="104" y="174" fill="#354A55" font-size="14">Dataset</text>
      <rect x="229" y="155" width="112" height="28" rx="14" fill="#F3E7E6"/>
      <text x="285" y="174" fill="#8D4850" font-size="12" font-weight="800">NO ACCESS</text>
      <text x="104" y="220" fill="#354A55" font-size="14">Preprocessing</text>
      <rect x="229" y="201" width="112" height="28" rx="14" fill="#F3ECDD"/>
      <text x="285" y="220" fill="#94651F" font-size="12" font-weight="800">UNCLEAR</text>
    </g>

    <g transform="translate(998 225)">
      <rect width="382" height="268" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="382" height="52" rx="8" fill="#F3ECDD"/>
      <rect y="44" width="382" height="8" fill="#F3ECDD"/>
      <circle cx="191" cy="0" r="22" fill="#B07A2A"/>
      <text x="191" y="6" fill="#FFFFFF" font-size="14" font-weight="800">3</text>
      <text x="191" y="33" fill="#17324D" font-size="14" font-weight="800" letter-spacing="1.4">DECIDE WHAT TO DO</text>
      <text x="191" y="87" fill="#59676F" font-size="13">Rule-based result</text>
      <rect x="67" y="107" width="248" height="46" rx="6" fill="#F3E7E6"/>
      <text x="191" y="136" fill="#8D4850" font-size="16" font-weight="800">COLLECT EVIDENCE FIRST</text>
      <text x="191" y="184" fill="#172635" font-size="14" font-weight="700">Next action</text>
      <text x="191" y="208" fill="#59676F" font-size="13">Request dataset access and</text>
      <text x="191" y="228" fill="#59676F" font-size="13">clarify preprocessing details.</text>
      <text x="191" y="254" fill="#94651F" font-size="12" font-weight="700">NO HIDDEN PAPER SCORE</text>
    </g>

    <line x1="60" y1="535" x2="1380" y2="535" stroke="#D4D1C8"/>
    <text x="720" y="572" fill="#17324D" font-size="16" font-weight="700">The output is a reviewable plan, not an automated verdict on paper quality.</text>
    <text x="720" y="596" fill="#69757B" font-size="12">You provide the evidence; ReproWeave keeps every claim, gap, dependency, and decision inspectable.</text>
  </g>
</svg>
