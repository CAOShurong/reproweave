<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">ReproWeave research workflow</title>
  <desc id="desc">A restrained academic graphical abstract showing evidence records converging into a transparent replication decision.</desc>
  <rect width="1200" height="500" fill="#f7f4ec"/>
  <rect x="1" y="1" width="1198" height="498" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <rect x="0" y="0" width="14" height="500" fill="#243744"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="62" y="72" fill="#873e4a" font-size="13" font-weight="700" letter-spacing="3.4">LOCAL-FIRST REPLICATION EVIDENCE</text>
    <text x="60" y="151" fill="#202a32" font-family="Georgia, serif" font-size="66" font-weight="700">ReproWeave</text>
    <text x="63" y="194" fill="#59666d" font-size="20">Decide what can be rebuilt before committing the lab.</text>
    <line x1="62" y1="225" x2="514" y2="225" stroke="#a9a294"/>
    <text x="62" y="266" fill="#202a32" font-family="Georgia, serif" font-size="22" font-weight="700">Claim-level evidence, joined to execution.</text>
    <text x="62" y="302" fill="#59666d" font-size="15">Exact locators · resource access · dependency-aware tasks</text>
    <text x="62" y="328" fill="#59666d" font-size="15">transparent readiness rules · deterministic evidence seals</text>
    <g transform="translate(62 382)">
      <line x1="0" y1="0" x2="452" y2="0" stroke="#243744" stroke-width="2"/>
      <text x="0" y="29" fill="#243744" font-size="12" font-weight="700">NO API</text>
      <text x="104" y="29" fill="#243744" font-size="12" font-weight="700">ZERO RUNTIME DEPENDENCIES</text>
      <text x="335" y="29" fill="#243744" font-size="12" font-weight="700">PYTHON 3.11+</text>
    </g>
  </g>
  <g transform="translate(585 50)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="18" fill="#243744" font-size="11" font-weight="700" letter-spacing="2.2">GRAPHICAL ABSTRACT</text>
    <line x1="0" y1="32" x2="555" y2="32" stroke="#243744" stroke-width="2"/>
    <g transform="translate(0 66)">
      <text x="0" y="0" fill="#6a7479" font-size="10" font-weight="700" letter-spacing="1.5">EVIDENCE RECORDS</text>
      <g transform="translate(0 22)">
        <rect width="138" height="58" fill="#fffef9" stroke="#bdb6a8"/>
        <rect width="5" height="58" fill="#60798a"/>
        <text x="18" y="25" fill="#202a32" font-size="13" font-weight="700">CLAIM</text>
        <text x="18" y="44" fill="#667178" font-size="10">Figure 4 · Appendix B</text>
      </g>
      <g transform="translate(0 94)">
        <rect width="138" height="58" fill="#fffef9" stroke="#bdb6a8"/>
        <rect width="5" height="58" fill="#667968"/>
        <text x="18" y="25" fill="#202a32" font-size="13" font-weight="700">RESOURCES</text>
        <text x="18" y="44" fill="#667178" font-size="10">code · data · hardware</text>
      </g>
      <g transform="translate(0 166)">
        <rect width="138" height="58" fill="#fffef9" stroke="#bdb6a8"/>
        <rect width="5" height="58" fill="#a9813d"/>
        <text x="18" y="25" fill="#202a32" font-size="13" font-weight="700">TASK GRAPH</text>
        <text x="18" y="44" fill="#667178" font-size="10">effort · state · dependency</text>
      </g>
      <path d="M138 51H185M138 123H185M138 195H185" fill="none" stroke="#8f8a80"/>
      <path d="M185 51V195M185 123H222" fill="none" stroke="#8f8a80"/>
      <circle cx="185" cy="123" r="4" fill="#873e4a"/>
      <g transform="translate(222 66)">
        <rect width="150" height="114" fill="#f0ece2" stroke="#8f8a80"/>
        <text x="18" y="27" fill="#873e4a" font-size="10" font-weight="700" letter-spacing="1.3">RULE-BASED TRIAGE</text>
        <line x1="18" y1="39" x2="132" y2="39" stroke="#bdb6a8"/>
        <text x="18" y="60" fill="#202a32" font-size="11">hard blockers first</text>
        <text x="18" y="80" fill="#202a32" font-size="11">then remaining effort</text>
        <text x="18" y="100" fill="#202a32" font-size="11">no hidden composite score</text>
      </g>
      <path d="M372 123H411" fill="none" stroke="#873e4a" stroke-width="2"/>
      <path d="M405 117L415 123 405 129" fill="none" stroke="#873e4a" stroke-width="2"/>
      <g transform="translate(415 66)">
        <rect width="140" height="114" fill="#243744"/>
        <text x="18" y="27" fill="#f7f4ec" font-size="10" font-weight="700" letter-spacing="1.2">DECISION QUEUE</text>
        <line x1="18" y1="39" x2="122" y2="39" stroke="#60798a"/>
        <text x="18" y="62" fill="#dce5df" font-size="12" font-weight="700">RUN NOW</text>
        <text x="18" y="83" fill="#e8d7b4" font-size="12" font-weight="700">PREPARE</text>
        <text x="18" y="104" fill="#edcbd0" font-size="12" font-weight="700">EVIDENCE FIRST</text>
      </g>
      <line x1="0" y1="252" x2="555" y2="252" stroke="#c3bcae"/>
      <text x="0" y="279" fill="#59666d" font-size="11">WHAT-IF INPUT</text>
      <text x="105" y="279" fill="#243744" font-family="monospace" font-size="11">rf-data=available</text>
      <text x="298" y="279" fill="#59666d" font-size="11">OUTPUT</text>
      <text x="354" y="279" fill="#243744" font-family="monospace" font-size="11">triage.md · report.html</text>
    </g>
  </g>
</svg>
