<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
  <title id="title">Why one replication candidate can start and another is blocked</title>
  <desc id="desc">A side-by-side worked example compares two fictional papers using explicit resource availability, missing evidence, remaining effort, and the resulting next action.</desc>
  <rect width="1440" height="540" rx="10" fill="#F7F6F2"/>
  <rect x="1" y="1" width="1438" height="538" rx="9" fill="none" stroke="#D4D1C8" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="720" y="58" fill="#172635" font-family="Georgia, Times New Roman, serif" font-size="32" font-weight="700">Why one candidate can start and another is blocked</text>
    <text x="720" y="88" fill="#65727A" font-size="14">The queue is explained by recorded facts, not by a hidden “paper quality” score.</text>

    <g transform="translate(80 126)">
      <rect width="600" height="344" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="600" height="62" rx="8" fill="#E7F0EA"/>
      <rect y="54" width="600" height="8" fill="#E7F0EA"/>
      <text x="300" y="27" fill="#2F6B55" font-size="12" font-weight="800" letter-spacing="1.4">CANDIDATE A</text>
      <text x="300" y="49" fill="#172635" font-size="16" font-weight="800">Quantized keyword spotter</text>
      <g text-anchor="start">
        <text x="52" y="105" fill="#59676F" font-size="13">Claim locator</text>
        <text x="300" y="105" fill="#172635" font-size="13" font-weight="700">Table 2, page 6</text>
        <text x="52" y="147" fill="#59676F" font-size="13">Code and data</text>
        <text x="300" y="147" fill="#2F6B55" font-size="13" font-weight="700">Available and versioned</text>
        <text x="52" y="189" fill="#59676F" font-size="13">Required hardware</text>
        <text x="300" y="189" fill="#172635" font-size="13" font-weight="700">Already in the lab</text>
        <text x="52" y="231" fill="#59676F" font-size="13">Unresolved blockers</text>
        <text x="300" y="231" fill="#172635" font-size="13" font-weight="700">None recorded</text>
        <text x="52" y="273" fill="#59676F" font-size="13">Remaining work</text>
        <text x="300" y="273" fill="#172635" font-size="13" font-weight="700">5 hours across 3 tasks</text>
      </g>
      <rect x="52" y="298" width="496" height="34" rx="17" fill="#2F6B55"/>
      <text x="300" y="320" fill="#FFFFFF" font-size="13" font-weight="800">RUN NOW — begin with environment setup</text>
    </g>

    <g transform="translate(760 126)">
      <rect width="600" height="344" rx="8" fill="#FFFFFF" stroke="#C9C6BC" stroke-width="1.5"/>
      <rect width="600" height="62" rx="8" fill="#F3E7E6"/>
      <rect y="54" width="600" height="8" fill="#F3E7E6"/>
      <text x="300" y="27" fill="#8D4850" font-size="12" font-weight="800" letter-spacing="1.4">CANDIDATE B</text>
      <text x="300" y="49" fill="#172635" font-size="16" font-weight="800">RF anomaly detector</text>
      <g text-anchor="start">
        <text x="52" y="105" fill="#59676F" font-size="13">Claim locator</text>
        <text x="300" y="105" fill="#172635" font-size="13" font-weight="700">Figure 5, appendix C</text>
        <text x="52" y="147" fill="#59676F" font-size="13">Code and data</text>
        <text x="300" y="147" fill="#8D4850" font-size="13" font-weight="700">Code found; dataset unavailable</text>
        <text x="52" y="189" fill="#59676F" font-size="13">Required hardware</text>
        <text x="300" y="189" fill="#172635" font-size="13" font-weight="700">SDR model not specified</text>
        <text x="52" y="231" fill="#59676F" font-size="13">Unresolved blockers</text>
        <text x="300" y="231" fill="#8D4850" font-size="13" font-weight="700">Dataset access + device identity</text>
        <text x="52" y="273" fill="#59676F" font-size="13">Remaining work</text>
        <text x="300" y="273" fill="#172635" font-size="13" font-weight="700">Unknown until blockers resolve</text>
      </g>
      <rect x="52" y="298" width="496" height="34" rx="17" fill="#8D4850"/>
      <text x="300" y="320" fill="#FFFFFF" font-size="13" font-weight="800">COLLECT EVIDENCE FIRST — contact authors</text>
    </g>

    <text x="720" y="508" fill="#65727A" font-size="12">Fictional example. ReproWeave records the reasons so another researcher can challenge or update the decision.</text>
  </g>
</svg>
