<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">ReproWeave workflow</title>
  <desc id="desc">Seven stages move from a bounded question to a sealed evidence report.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#278a7f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17313a" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1100" height="650" rx="24" fill="#f4f1e8"/>
  <text x="70" y="72" fill="#17313a" font-family="Georgia,serif" font-size="37" font-weight="700">A review that can explain itself</text>
  <text x="70" y="105" fill="#607074" font-family="system-ui,sans-serif" font-size="16">Every transition produces a file another person can inspect.</text>
  <path d="M210 211H355M485 211H630M760 211H905M920 275v90M905 429H760M630 429H485M355 429H210" fill="none" stroke="#278a7f" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(70 155)" filter="url(#shadow)">
      <rect width="140" height="112" rx="16" fill="#17313a"/>
      <text x="22" y="31" fill="#67ddc7" font-size="12" font-weight="800">01 · FRAME</text>
      <text x="22" y="62" fill="#fff" font-size="16" font-weight="700">Question</text>
      <text x="22" y="86" fill="#b8d2cf" font-size="12">Criteria first</text>
    </g>
    <g transform="translate(355 155)" filter="url(#shadow)">
      <rect width="130" height="112" rx="16" fill="#fffdf7"/>
      <text x="20" y="31" fill="#278a7f" font-size="12" font-weight="800">02 · SCREEN</text>
      <text x="20" y="62" fill="#17313a" font-size="16" font-weight="700">Papers</text>
      <text x="20" y="86" fill="#607074" font-size="12">Reasons logged</text>
    </g>
    <g transform="translate(630 155)" filter="url(#shadow)">
      <rect width="130" height="112" rx="16" fill="#fffdf7"/>
      <text x="20" y="31" fill="#278a7f" font-size="12" font-weight="800">03 · ANCHOR</text>
      <text x="20" y="62" fill="#17313a" font-size="16" font-weight="700">Claims</text>
      <text x="20" y="86" fill="#607074" font-size="12">Exact locators</text>
    </g>
    <g transform="translate(905 155)" filter="url(#shadow)">
      <rect width="130" height="112" rx="16" fill="#fffdf7"/>
      <text x="20" y="31" fill="#278a7f" font-size="12" font-weight="800">04 · INVENTORY</text>
      <text x="20" y="62" fill="#17313a" font-size="16" font-weight="700">Resources</text>
      <text x="20" y="86" fill="#607074" font-size="12">Versions + access</text>
    </g>
    <g transform="translate(760 373)" filter="url(#shadow)">
      <rect width="145" height="112" rx="16" fill="#fffdf7"/>
      <text x="20" y="31" fill="#278a7f" font-size="12" font-weight="800">05 · ASSESS</text>
      <text x="20" y="62" fill="#17313a" font-size="16" font-weight="700">Evidence map</text>
      <text x="20" y="86" fill="#607074" font-size="12">Unknown stays unknown</text>
    </g>
    <g transform="translate(485 373)" filter="url(#shadow)">
      <rect width="145" height="112" rx="16" fill="#fffdf7"/>
      <text x="20" y="31" fill="#278a7f" font-size="12" font-weight="800">06 · PLAN</text>
      <text x="20" y="62" fill="#17313a" font-size="16" font-weight="700">Task graph</text>
      <text x="20" y="86" fill="#607074" font-size="12">Blockers exposed</text>
    </g>
    <g transform="translate(70 373)" filter="url(#shadow)">
      <rect width="140" height="112" rx="16" fill="#dba255"/>
      <text x="20" y="31" fill="#17313a" font-size="12" font-weight="900">07 · PUBLISH</text>
      <text x="20" y="62" fill="#17313a" font-size="16" font-weight="800">Audit + seal</text>
      <text x="20" y="86" fill="#32474d" font-size="12">Portable report</text>
    </g>
  </g>
  <rect x="70" y="548" width="965" height="55" rx="12" fill="#e4ded0"/>
  <text x="552.5" y="581" text-anchor="middle" fill="#4d5b5e" font-family="system-ui,sans-serif" font-size="14">The tool validates structure. The researcher remains responsible for evidence, interpretation, safety, and scientific judgment.</text>
</svg>
