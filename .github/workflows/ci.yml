name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install quality tools and package
        run: python -m pip install -r requirements/ci.txt -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Format
        run: ruff format --check src tests scripts
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate deterministic demonstration
        run: python -m reproweave demo "${{ runner.temp }}/reproweave-demo"
      - name: Audit demonstration
        run: python -m reproweave audit --workspace "${{ runner.temp }}/reproweave-demo"
      - name: Check reviewer agreement
        run: python -m reproweave agreement --workspace "${{ runner.temp }}/reproweave-demo"
      - name: Triage demonstration
        run: python -m reproweave triage --workspace "${{ runner.temp }}/reproweave-demo" --format markdown --output "${{ runner.temp }}/triage.md"
      - name: Verify evidence seal
        run: python -m reproweave verify --workspace "${{ runner.temp }}/reproweave-demo"
      - name: Check deterministic seal root
        run: >-
          python -c "import json,pathlib;
          p=pathlib.Path(r'${{ runner.temp }}/reproweave-demo/reproweave-seal.json');
          assert json.loads(p.read_text(encoding='utf-8'))['root']
          == 'sha256:f81c893af76059a40fd6b942fbe289c87f5a39b2df7099343d94594334bbbfe6'"
      - name: Repository audit
        run: python scripts/check_repository.py

  package:
    name: Build and clean-wheel smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Build distributions
        run: python -m pip install -r requirements/ci.txt && python -m build
      - name: Exercise installed CLI success and failure paths
        run: >-
          python scripts/acceptance_cli.py
          --wheel-dir dist
          --root "${{ runner.temp }}/wheel-acceptance"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions-${{ runner.os }}
          path: dist/*
