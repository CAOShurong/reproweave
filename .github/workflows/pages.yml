name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble static site
        run: |
          mkdir -p _site/demo _site/assets _site/schemas
          cp -R site/. _site/
          cp docs/assets/*.svg _site/assets/
          cp examples/demo/reports/evidence-report.html _site/demo/
          cp examples/demo/reports/evidence-matrix.csv _site/demo/
          cp examples/demo/reports/replication-plan.md _site/demo/
          cp examples/demo/reports/replication-triage.md _site/demo/
          cp schemas/*.json _site/schemas/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
