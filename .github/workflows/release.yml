name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit to belong to main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Require the tag to match the package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match package version {expected!r}")
          PY
      - name: Build distributions
        run: |
          python -m pip install -r requirements/ci.txt
          python -m build
          python -m twine check dist/*
      - name: Exercise wheel success and failure paths
        run: >-
          python scripts/acceptance_cli.py
          --wheel-dir dist
          --root "${{ runner.temp }}/release-acceptance"
      - name: Write checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Attest release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Preserve verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reproweave
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist
      - name: Keep only package distributions for PyPI
        run: rm dist/SHA256SUMS
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  publish-github:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "ReproWeave ${GITHUB_REF_NAME}"

  verify-github-release:
    name: Verify public GitHub release
    needs: publish-github
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Download public assets without credentials
        env:
          PUBLIC_DIST: ${{ runner.temp }}/public-dist
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p "${PUBLIC_DIST}"
          for asset in \
            "reproweave-${version}-py3-none-any.whl" \
            "reproweave-${version}.tar.gz" \
            "SHA256SUMS"
          do
            curl --fail --location --silent --show-error \
              --retry 8 --retry-all-errors --retry-delay 5 \
              --output "${PUBLIC_DIST}/${asset}" "${base}/${asset}"
          done
      - name: Verify public checksums and installed behavior
        env:
          PUBLIC_DIST: ${{ runner.temp }}/public-dist
        run: |
          set -euo pipefail
          (cd "${PUBLIC_DIST}" && sha256sum --check SHA256SUMS)
          python scripts/acceptance_cli.py \
            --wheel-dir "${PUBLIC_DIST}" \
            --root "${{ runner.temp }}/public-release-acceptance"
