name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel in a clean environment
        run: |
          python -m venv clean-install
          clean-install/bin/python -m pip install dist/*.whl
          clean-install/bin/reproweave --version
          clean-install/bin/reproweave demo release-demo
          clean-install/bin/reproweave audit --workspace release-demo
          clean-install/bin/reproweave triage --workspace release-demo --format markdown --output release-triage.md
          clean-install/bin/reproweave verify --workspace release-demo
          clean-install/bin/reproweave report --workspace release-demo --output reports/release-report.html
      - name: Write checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Preserve verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reproweave
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Keep only package distributions for PyPI
        run: rm dist/SHA256SUMS
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-github:
    name: Publish GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "ReproWeave ${GITHUB_REF_NAME}"
